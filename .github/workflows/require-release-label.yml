name: Require Release Label

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]
    branches: [main]

jobs:
  check-label:
    runs-on: ubuntu-latest
    steps:
      - name: Check release label present
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          MATCHES=$(echo "$LABELS_JSON" | jq -r '.[].name' | grep -oP '^release:\K(patch|minor|major|none)$' || true)
          COUNT=$(echo "$MATCHES" | grep -c . || true)

          if [[ "$COUNT" -ne 1 ]]; then
            echo "::error::Cette PR doit avoir exactement un label release:patch, release:minor, release:major ou release:none avant merge."
            exit 1
          fi