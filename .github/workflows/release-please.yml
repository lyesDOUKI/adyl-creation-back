name: Release Please

# 1. Release Please : crée / met à jour la PR de release (inchangé).
# 2. API release : DÉCIDE la version de l'API à releaser, de façon automatique.
#
#    La version n'est plus choisie dans les PR. À chaque push sur main, on compare le
#    contrat d'API de main avec celui de la DERNIÈRE release GitHub (oasdiff), et on en
#    déduit la version (logique dans .github/scripts/api-vs-last-release.sh) :
#
#      Situation par rapport à la dernière release          | Version de l'API
#      -----------------------------------------------------|----------------------
#      Aucune release, ou contrat absent de cette release   | 1.0.0
#      Aucun changement (hors info.version)                 | inchangée
#      Cosmétique seul                                      | patch  : 2.3.0 -> 2.3.1
#      Fonctionnel non cassant                              | mineur : 2.3.0 -> 2.4.0
#      Fonctionnel cassant (breaking)                       | majeur : 2.3.0 -> 3.0.0
#
#    Cette version est :
#      - écrite dans version.txt de la PR de release, et openapi.yaml y est régénéré
#        (Maven), dans un commit du robot : version.txt n'est modifié QUE par ce robot ;
#      - affichée dans un commentaire de la PR de release (avec le lien de revue
#        interactive oasdiff.com et le rapport HTML en artefact) ;
#      - (optionnel) ajoutée dans le CHANGELOG de la PR de release.
#
#    Le calcul repart toujours de la dernière release publiée : plusieurs PR entre deux
#    releases se cumulent en UN seul incrément, sans version « sautée ».
#    Le workflow api-contract.yml vérifie sur la PR de release que la version écrite est
#    bien la version attendue : une PR de release périmée ne peut pas être mergée.
#
#    Ce job ne fait JAMAIS échouer le workflow (continue-on-error), mais en cas de
#    problème la PR de release reste rouge côté api-contract.yml : on ne livre pas une
#    version non vérifiée.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Évite que deux runs modifient la PR de release en même temps.
concurrency:
  group: release-please
  cancel-in-progress: false

env:
  SPEC_PATH: application/api-contract/openapi.yaml
  VERSION_FILE: application/api-contract/version.txt
  OASDIFF_VERSION: "1.33.0"
  # Ajout d'un bloc « API Contract » dans le CHANGELOG de la PR de release (voir étape dédiée).
  UPDATE_CHANGELOG: "true"
  CHANGELOG_PATH: CHANGELOG.md

jobs:
  # ============================================================
  # 1. RELEASE PLEASE (inchangé)
  # ============================================================
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - name: Create or update release PRs
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ============================================================
  # 2. VERSION DE L'API : contrat de la dernière release -> contrat de main
  # ============================================================
  api-release-report:
    name: API release report
    needs: release-please
    # Inutile quand la PR de release vient d'être mergée (la release est créée).
    if: needs.release-please.outputs.releases_created != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Filet de sécurité : un incident ici ne rend jamais le workflow rouge.
    # (La PR de release, elle, restera bloquée par api-contract.yml si sa version est fausse.)
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout de main (historique et tags complets)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Retrouver la PR de release ouverte (branche release-please--…)
      # ------------------------------------------------------------
      - name: Trouver la PR de release
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          LINES="$(gh pr list --state open --base "$BASE" --limit 50 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | "\(.number) \(.headRefName)"')"

          if [[ -z "$LINES" ]]; then
            echo "ℹ️ Aucune PR de release ouverte : rien à faire."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NUMBERS="$(awk '{print $1}' <<< "$LINES" | paste -sd' ' -)"
          BRANCH="$(head -n1 <<< "$LINES" | awk '{print $2}')"
          echo "PR de release : ${NUMBERS} (branche ${BRANCH})"
          {
            echo "found=true"
            echo "numbers=${NUMBERS}"
            echo "branch=${BRANCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Installer oasdiff et yq
        if: steps.pr.outputs.found == 'true'
        run: |
          set -euo pipefail

          ARCHIVE="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          BASE_URL="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          mkdir -p "$RUNNER_TEMP/oasdiff"
          cd "$RUNNER_TEMP/oasdiff"
          curl -fsSLO "${BASE_URL}/${ARCHIVE}"
          curl -fsSLO "${BASE_URL}/checksums.txt"
          grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c -
          tar -xzf "$ARCHIVE" oasdiff
          echo "$PWD" >> "$GITHUB_PATH"
          ./oasdiff --version

          YQ_VERSION="v4.45.1"
          YQ_SHA256="654d2943ca1d3be2024089eb4f270f4070f491a0610481d128509b2834870049"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o "$RUNNER_TEMP/yq"
          echo "${YQ_SHA256}  $RUNNER_TEMP/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yq" --version

      # ------------------------------------------------------------
      # Comparaison : contrat de la dernière release  ->  contrat de main,
      # et calcul de la version d'API (script partagé avec api-contract.yml).
      #   state = no_spec | first | unknown | compare
      #   bump  = first | none | patch | minor | major
      #   next_version = version à publier ("" si state = no_spec | unknown)
      # ------------------------------------------------------------
      - name: Comparer avec la dernière release et calculer la version d'API
        id: analyse
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BREAKING_LEVEL: ERR
          COSMETIC_ELEMENTS: description,examples,summary,title
        run: bash .github/scripts/api-vs-last-release.sh

      # ------------------------------------------------------------
      # Lien de revue interactive oasdiff.com (comme dans api-contract.yml)
      #
      # L'action oasdiff ne sait commenter que sur un événement `pull_request` : ici
      # (événement `push`), elle ne peut pas poster sur la PR de release. On génère donc
      # le lien avec le CLI (`changelog --open`, la même mécanique que l'action) et on le
      # publie nous-mêmes dans le commentaire. Les specs sont chiffrées avant l'envoi ;
      # la clé de déchiffrement est dans le lien (partie après #), valable 7 jours.
      # Le lien n'est volontairement PAS écrit dans le CHANGELOG.md versionné.
      # ------------------------------------------------------------
      - name: Générer le lien de revue interactive oasdiff.com
        id: review-link
        if: |
          steps.pr.outputs.found == 'true'
          && steps.analyse.outputs.state == 'compare'
          && steps.analyse.outputs.change != 'none'
        continue-on-error: true
        run: |
          set -u
          OUT="$RUNNER_TEMP"
          URL_FILE="$OUT/review-url.txt"
          LOG="$OUT/review-cli.log"
          : > "$URL_FILE"

          # Depuis oasdiff 1.19.1, la ligne « Opening <url> » est écrite sur stderr :
          # on capture donc les deux flux.
          timeout 120 oasdiff changelog "$OUT/last-release-openapi.yaml" "$SPEC_PATH" --open \
            > "$LOG" 2>&1 || true

          URL="$(grep -Eo 'https?://[^[:space:]]*oasdiff\.com/review/[^[:space:]]+' "$LOG" | head -n1 || true)"

          if [[ -n "$URL" ]]; then
            printf '%s' "$URL" > "$URL_FILE"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "✅ Lien de revue généré (non affiché dans les logs : il contient la clé de déchiffrement)."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucun lien de revue oasdiff.com généré par le CLI (secours : action oasdiff, lien dans le résumé du job)."
            tail -n 5 "$LOG" || true
          fi

      # ------------------------------------------------------------
      # Construction du commentaire de PR et du bloc de CHANGELOG
      # ------------------------------------------------------------
      - name: Construire le commentaire et le bloc de changelog
        if: steps.pr.outputs.found == 'true' && steps.analyse.outputs.state != 'no_spec'
        env:
          STATE: ${{ steps.analyse.outputs.state }}
          FIRST_REASON: ${{ steps.analyse.outputs.first_reason }}
          CHANGE: ${{ steps.analyse.outputs.change }}
          BREAKING: ${{ steps.analyse.outputs.breaking }}
          BUMP: ${{ steps.analyse.outputs.bump }}
          N_ERR: ${{ steps.analyse.outputs.n_err }}
          N_WARN: ${{ steps.analyse.outputs.n_warn }}
          N_INFO: ${{ steps.analyse.outputs.n_info }}
          LAST_TAG: ${{ steps.analyse.outputs.last_tag }}
          OLD_VERSION: ${{ steps.analyse.outputs.old_version }}
          NEXT_VERSION: ${{ steps.analyse.outputs.next_version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP"
          COMMENT="$OUT/release-comment.md"
          BLOCK="$OUT/api-changelog-block.md"
          : > "$COMMENT"
          : > "$BLOCK"

          MARKER='<!-- api-release-report -->'
          API_START='<!-- api-contract:start -->'
          API_END='<!-- api-contract:end -->'
          SHORT_SHA="${SHA::7}"
          TAG_URL="${SERVER_URL}/${REPO}/releases/tag/${LAST_TAG}"
          NOW="$(date -u '+%Y-%m-%d %H:%M UTC')"

          case "$BUMP" in
            first) BUMP_LABEL="première version" ;;
            patch) BUMP_LABEL="incrément de **patch**" ;;
            minor) BUMP_LABEL="incrément **mineur**" ;;
            major) BUMP_LABEL="incrément **majeur**" ;;
            *)     BUMP_LABEL="version **inchangée**" ;;
          esac

          # Liens vers les rapports (HTML en artefact + revue interactive oasdiff.com)
          REVIEW_URL="$(cat "$OUT/review-url.txt" 2>/dev/null || true)"
          links_block() {
            echo "- 🖥️ **Rapport HTML interactif** : artefact \`oasdiff-release-report\` du [run](${RUN_URL})."
            if [[ -n "$REVIEW_URL" ]]; then
              echo "- 🔗 **Revue côte-à-côte oasdiff.com** : [ouvrir la revue](${REVIEW_URL}) _(lien valable 7 jours, recréé à chaque push sur main)_"
            else
              echo "- 🔗 **Revue côte-à-côte oasdiff.com** : lien dans le [résumé du run](${RUN_URL}) (si généré)."
            fi
          }

          versions_table() {
            echo "| | |"
            echo "|---|---|"
            echo "| **Dernière release** | [\`${LAST_TAG}\`](${TAG_URL}) · API \`${OLD_VERSION:-—}\` |"
            echo "| **Version d'API à releaser** (\`main\` @ \`${SHORT_SHA}\`) | \`${NEXT_VERSION:-—}\` (${BUMP_LABEL}) |"
          }

          applied_note() {
            echo "> 🤖 Cette version est calculée automatiquement (oasdiff, vs la dernière release publiée) et écrite par le robot"
            echo "> dans \`version.txt\` et \`openapi.yaml\` de cette PR de release. Ne la modifiez pas à la main."
          }

          case "$STATE" in
            # ----------------------------------------------------
            first)
              {
                echo "$MARKER"
                echo "## 🚀 API à releaser — première version"
                echo ""
                echo "🆕 **Ce sera la première version de l'API releasée et publiée en production.**"
                echo ""
                if [[ "$FIRST_REASON" == "nocontract" ]]; then
                  echo "Le contrat d'API n'existait pas encore dans la dernière release (\`${LAST_TAG}\`)."
                else
                  echo "Aucune release précédente n'existe."
                fi
                echo ""
                echo "| | |"
                echo "|---|---|"
                echo "| **Version de l'API** | \`${NEXT_VERSION:-—}\` |"
                echo "| **Contrat** | \`main\` @ \`${SHORT_SHA}\` |"
                echo ""
                echo "Aucune comparaison de compatibilité n'est possible : il n'y a pas encore d'API en production."
                echo ""
                applied_note
                echo ""
                echo "<sub>Mis à jour à chaque push sur main · ${NOW}</sub>"
              } > "$COMMENT"

              {
                echo "$API_START"
                echo "### API Contract"
                echo ""
                echo "🆕 Première version de l'API publiée : \`${NEXT_VERSION:-—}\`."
                echo "$API_END"
              } > "$BLOCK"
              ;;

            # ----------------------------------------------------
            unknown)
              {
                echo "$MARKER"
                echo "## 🚀 API à releaser — version non calculée"
                echo ""
                echo "⚠️ Impossible de déterminer la version de l'API : lecture de la dernière release (\`${LAST_TAG:-?}\`), tag introuvable, version de base non conforme ou erreur oasdiff."
                echo ""
                echo "**La version de l'API de cette PR de release n'a pas été modifiée** et le check \`API Contract\` restera en échec"
                echo "tant que le calcul n'aura pas abouti. Consultez les logs du [run](${RUN_URL}) puis relancez le job."
                echo ""
                echo "<sub>Mis à jour à chaque push sur main · ${NOW}</sub>"
              } > "$COMMENT"
              ;;

            # ----------------------------------------------------
            compare)
              case "$CHANGE" in
                none)
                  {
                    echo "$MARKER"
                    echo "## 🚀 API à releaser — ✅ Aucun changement d'API"
                    echo ""
                    versions_table
                    echo ""
                    echo "Le contrat d'API est identique à celui de la dernière release (hors \`info.version\`) : la version reste \`${NEXT_VERSION:-—}\`."
                    echo ""
                    applied_note
                    echo ""
                    echo "<sub>Mis à jour à chaque push sur main · ${NOW}</sub>"
                  } > "$COMMENT"
                  # Pas de bloc dans le changelog : rien à signaler.
                  ;;

                cosmetic)
                  {
                    echo "$MARKER"
                    echo "## 🚀 API à releaser — ✅ Changement cosmétique"
                    echo ""
                    versions_table
                    echo "| **Classification** | \`cosmetic\` |"
                    echo ""
                    echo "Seuls \`description\`, \`examples\`, \`summary\` et \`title\` ont changé depuis la dernière release."
                    echo ""
                    applied_note
                    echo ""
                    echo "<details><summary>Voir le diff</summary>"
                    echo ""
                    echo '```diff'
                    head -c 20000 "$OUT/diff.txt" || true
                    echo '```'
                    echo "</details>"
                    echo ""
                    links_block
                    echo ""
                    echo "<sub>Mis à jour à chaque push sur main · ${NOW}</sub>"
                  } > "$COMMENT"

                  {
                    echo "$API_START"
                    echo "### API Contract"
                    echo ""
                    echo "API \`${OLD_VERSION:-—}\` → \`${NEXT_VERSION:-—}\` : modifications cosmétiques uniquement (description, summary, title, examples)."
                    echo "$API_END"
                  } > "$BLOCK"
                  ;;

                *)
                  if [[ "$BREAKING" == "true" ]]; then
                    ICON="⚠️"; TITLE="Breaking change détecté"
                    SHORT="⚠️ **breaking change**"
                  else
                    ICON="✅"; TITLE="Changement non cassant"
                    SHORT="changement fonctionnel non cassant"
                  fi

                  {
                    echo "$MARKER"
                    echo "## 🚀 API à releaser — ${ICON} ${TITLE}"
                    echo ""
                    versions_table
                    echo "| **Classification** | \`functional\` / \`breaking=${BREAKING}\` |"
                    echo "| **Erreurs (ERR)** | ${N_ERR:-0} |"
                    echo "| **Warnings (WARN)** | ${N_WARN:-0} |"
                    echo "| **Infos (INFO)** | ${N_INFO:-0} |"
                    echo ""
                    applied_note
                    echo ""

                    if [[ -s "$OUT/breaking-bullets.md" ]]; then
                      echo "### 🛑 Changements depuis la dernière release"
                      echo ""
                      cat "$OUT/breaking-bullets.md"
                      echo ""
                    fi

                    echo "### 📋 Changelog oasdiff"
                    echo ""
                    echo "<details><summary>Voir le changelog complet</summary>"
                    echo ""
                    echo '```'
                    head -c 30000 "$OUT/changelog.txt" || true
                    echo '```'
                    echo "</details>"
                    echo ""
                    echo "### 🔧 Diff structurel"
                    echo ""
                    echo "<details><summary>Voir le diff (hors éléments cosmétiques)</summary>"
                    echo ""
                    echo '```diff'
                    head -c 20000 "$OUT/diff.txt" || true
                    echo '```'
                    echo "</details>"
                    echo ""
                    echo "### 📎 Rapports et liens"
                    echo ""
                    links_block
                    echo ""
                    echo "<sub>Mis à jour à chaque push sur main · ${NOW}</sub>"
                  } > "$COMMENT"

                  {
                    echo "$API_START"
                    echo "### API Contract"
                    echo ""
                    echo "API \`${OLD_VERSION:-—}\` → \`${NEXT_VERSION:-—}\` : ${SHORT}."
                    if [[ -s "$OUT/breaking-bullets.md" ]]; then
                      TOTAL="$(wc -l < "$OUT/breaking-bullets.md")"
                      echo ""
                      head -n 50 "$OUT/breaking-bullets.md"
                      if (( TOTAL > 50 )); then
                        echo ""
                        echo "… et $((TOTAL - 50)) autre(s) changement(s) : voir le commentaire de la PR de release."
                      fi
                    fi
                    echo "$API_END"
                  } > "$BLOCK"
                  ;;
              esac
              ;;
          esac

          echo "Commentaire : $(wc -c < "$COMMENT") octets · bloc changelog : $(wc -c < "$BLOCK") octets"

      # ------------------------------------------------------------
      # Commentaire sur la PR de release (créé ou mis à jour)
      # ------------------------------------------------------------
      - name: Publier le rapport sur la PR de release
        if: steps.pr.outputs.found == 'true' && steps.analyse.outputs.state != 'no_spec'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBERS: ${{ steps.pr.outputs.numbers }}
        run: |
          set -euo pipefail
          MARKER='<!-- api-release-report -->'
          FILE="$RUNNER_TEMP/release-comment.md"

          for PR in $PR_NUMBERS; do
            IDS=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id")
            ID=$(printf '%s\n' "$IDS" | head -n1)

            if [[ -n "$ID" ]]; then
              gh api -X PATCH "repos/${REPO}/issues/comments/${ID}" -F body=@"$FILE" > /dev/null
              echo "PR #${PR} : commentaire #${ID} mis à jour."
            else
              gh api "repos/${REPO}/issues/${PR}/comments" -F body=@"$FILE" > /dev/null
              echo "PR #${PR} : commentaire créé."
            fi
          done

      # Secours : si le CLI n'a produit aucun lien, l'action oasdiff le publie dans le
      # résumé du job (sans token, elle ne tente pas de commenter).
      - name: Revue oasdiff.com (secours, lien dans le résumé du job)
        if: |
          steps.pr.outputs.found == 'true'
          && steps.analyse.outputs.state == 'compare'
          && steps.analyse.outputs.change != 'none'
          && steps.review-link.outputs.found != 'true'
        continue-on-error: true
        uses: oasdiff/oasdiff-action/changelog@v0
        with:
          base: '${{ steps.analyse.outputs.last_tag }}:${{ env.SPEC_PATH }}'
          revision: '${{ env.SPEC_PATH }}'
          review: 'true'

      - name: Sauvegarder le rapport HTML oasdiff
        if: |
          steps.pr.outputs.found == 'true'
          && steps.analyse.outputs.state == 'compare'
          && steps.analyse.outputs.change != 'none'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: oasdiff-release-report
          path: ${{ runner.temp }}/diff.html
          retention-days: 14

      # ============================================================
      # 3. ÉCRITURE DANS LA PR DE RELEASE : version d'API + CHANGELOG
      #
      # ⚠️ Release Please régénère la branche de sa PR quand il la met à jour
      #    (la mise à jour du ref écrase les commits ajoutés à la main). Le commit
      #    du robot est donc recréé à chaque run, APRÈS Release Please, et toutes les
      #    opérations sont idempotentes :
      #      - version.txt / openapi.yaml : réécrits seulement si la version diffère ;
      #      - CHANGELOG : le bloc (entre marqueurs HTML) n'est remplacé que dans la
      #        section de la nouvelle release, jamais dans les anciennes.
      #    Le push avec RELEASE_PAT déclenche api-contract.yml sur la PR de release.
      # ============================================================
      - name: Checkout de la branche de la PR de release
        if: |
          steps.pr.outputs.found == 'true'
          && (steps.analyse.outputs.state == 'first' || steps.analyse.outputs.state == 'compare')
          && steps.analyse.outputs.next_version != ''
        id: checkout-release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PAT }}
          path: release-branch
          fetch-depth: 1

      - name: Configuration de Java 25
        if: steps.checkout-release.outcome == 'success'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Écrit la version dans version.txt puis régénère openapi.yaml avec Maven :
      # openapi.yaml reste ainsi EXACTEMENT ce que produirait le build (le drift check de
      # api-contract.yml passe), sans bricoler le YAML à la main.
      - name: Aligner la version de l'API sur la PR de release
        id: align
        if: steps.checkout-release.outcome == 'success'
        working-directory: release-branch
        env:
          NEXT_VERSION: ${{ steps.analyse.outputs.next_version }}
        run: |
          set -euo pipefail

          CURRENT_TXT="$(tr -d '[:space:]' < "$VERSION_FILE" 2>/dev/null || true)"
          CURRENT_SPEC="$(yq -r '.info.version // ""' "$SPEC_PATH" 2>/dev/null || true)"

          if [[ "$CURRENT_TXT" == "$NEXT_VERSION" && "$CURRENT_SPEC" == "$NEXT_VERSION" ]]; then
            echo "✅ La PR de release porte déjà la version d'API ${NEXT_VERSION}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # En cas d'échec, on ne laisse jamais un état à moitié écrit (version.txt
          # modifié mais openapi.yaml ancien) : le commit suivant ne doit rien embarquer.
          trap 'git checkout -- "$VERSION_FILE" "$SPEC_PATH" 2>/dev/null || true' ERR

          echo "ℹ️ Version d'API de la PR de release : '${CURRENT_TXT:-—}' → '${NEXT_VERSION}'."
          printf '%s\n' "$NEXT_VERSION" > "$VERSION_FILE"
          mvn -B -ntp verify -pl application -am -DskipTests

          RESULT="$(yq -r '.info.version // ""' "$SPEC_PATH")"
          if [[ "$RESULT" != "$NEXT_VERSION" ]]; then
            echo "❌ Après régénération, ${SPEC_PATH} indique '${RESULT}' au lieu de '${NEXT_VERSION}'."
            echo "   Vérifiez OpenApiConfig et la copie de version.txt vers META-INF/version.txt."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "✅ Version d'API ${NEXT_VERSION} écrite dans ${VERSION_FILE} et ${SPEC_PATH}."

      - name: Mettre à jour le CHANGELOG de la PR de release
        if: ${{ !cancelled() && env.UPDATE_CHANGELOG == 'true' && steps.checkout-release.outcome == 'success' }}
        continue-on-error: true
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          CHANGELOG_FILE: release-branch/${{ env.CHANGELOG_PATH }}
          BLOCK_FILE: ${{ runner.temp }}/api-changelog-block.md
        run: |
          set -euo pipefail

          if [[ ! -f "$CHANGELOG_FILE" ]]; then
            echo "::notice::${CHANGELOG_FILE} introuvable sur la branche ${BRANCH} : changelog non modifié."
            exit 0
          fi

          python3 - <<'PY'
          import os, re, pathlib

          path = pathlib.Path(os.environ["CHANGELOG_FILE"])
          block_path = pathlib.Path(os.environ["BLOCK_FILE"])
          START = "<!-- api-contract:start -->"
          END = "<!-- api-contract:end -->"

          text = path.read_text(encoding="utf-8")
          block = block_path.read_text(encoding="utf-8").strip("\n") if block_path.exists() else ""

          # La première section « ## » est celle de la nouvelle release (Release Please
          # insère toujours la plus récente en haut).
          headings = list(re.finditer(r"(?m)^## ", text))
          if not headings:
              print("Aucune section de release trouvée : changelog inchangé.")
              raise SystemExit(0)

          start = headings[0].start()
          end = headings[1].start() if len(headings) > 1 else len(text)
          section = text[start:end]

          # Idempotence : on retire l'ancien bloc de CETTE section uniquement.
          section = re.sub(r"\n*" + re.escape(START) + r".*?" + re.escape(END) + r"\n*", "\n", section, flags=re.S)
          section = section.rstrip("\n") + "\n"
          if block:
              section += "\n" + block + "\n"
          if end < len(text):
              section += "\n"

          new_text = text[:start] + section + text[end:]
          if new_text != text:
              path.write_text(new_text, encoding="utf-8")
              print("CHANGELOG mis à jour.")
          else:
              print("CHANGELOG déjà à jour.")
          PY

      # Un seul commit pour la version d'API et le CHANGELOG.
      - name: Committer et pousser sur la PR de release
        if: ${{ !cancelled() && steps.checkout-release.outcome == 'success' }}
        working-directory: release-branch
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          NEXT_VERSION: ${{ steps.analyse.outputs.next_version }}
          ALIGN_CHANGED: ${{ steps.align.outputs.changed }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Uniquement les fichiers gérés ici (Maven peut produire d'autres fichiers locaux).
          for f in "$VERSION_FILE" "$SPEC_PATH" "$CHANGELOG_PATH"; do
            [[ -e "$f" ]] && git add -- "$f"
          done

          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
            exit 0
          fi

          if [[ "$ALIGN_CHANGED" == "true" ]]; then
            MSG="chore(release): aligne la version de l'API (${NEXT_VERSION}) et le changelog"
          else
            MSG="chore(release): met à jour le changelog"
          fi
          git commit -m "$MSG"
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "✅ Commit poussé sur ${BRANCH}."