name: CD - Build, Push GHCR, Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: cd-api
  cancel-in-progress: false

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: lyesdouki/adyl-creation-api

jobs:
  # =========================
  # CI (gate : rien ne part si ça échoue)
  # =========================
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # GHCR
      # =========================
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # BUILD + PUSH
      # =========================
      - name: Build et Push Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-vps-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS deployment
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          DISPATCH_TOKEN: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lyesdouki/adyl-creation-deployment/dispatches \
            -d "$(jq -n --arg tag "$IMAGE_TAG" \
              '{event_type:"deploy-app",client_payload:{service:"api",image_tag:$tag}}')"