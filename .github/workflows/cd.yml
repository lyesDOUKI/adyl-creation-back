name: CD - Build, Push GHCR, Deploy
on:
  push:
    tags:
      - 'v*'
env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: lyesdouki/adyl-creation-api
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # GHCR
      # =========================
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # BUILD + PUSH
      # =========================
      - name: Build et Push Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-vps-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS deployment
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/lyesdouki/adyl-creation-deployment/dispatches \
            -d "{\"event_type\":\"deploy-app\",\"client_payload\":{\"service\":\"api\",\"image_tag\":\"${{ github.ref_name }}\"}}"