name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  detect-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      bump_type: ${{ steps.detect.outputs.bump_type }}
    steps:
      - name: Detect release label
        id: detect
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          MATCHES=$(echo "$LABELS_JSON" | jq -r '.[].name' | grep -oP '^release:\K(patch|minor|major)$' || true)
          COUNT=$(echo "$MATCHES" | grep -c . || true)

          if [[ "$COUNT" -gt 1 ]]; then
            echo "::error::Plusieurs labels release:* détectés sur cette PR. Un seul est autorisé."
            exit 1
          elif [[ "$COUNT" -eq 1 ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump_type=$MATCHES" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: detect-release
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release script
        run: ./release.sh "${{ needs.detect-release.outputs.bump_type }}" --ci