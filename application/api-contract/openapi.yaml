openapi: 3.1.0
info:
  title: Adyl Creation API
  description: |-
    API de gestion des commandes, produits et rendez-vous d'Adyl Creation.
    Les erreurs sont retournées en `application/problem+json` (RFC 9457) :
    le champ `code` est l'identifiant unique d'une erreur.
  version: 1.0.0
servers:
- url: /
  description: Résolu dynamiquement selon l'hôte de déploiement
tags:
- name: Rendez-vous
  description: API pour la gestion des rendez-vous
- name: Commandes
  description: API pour la gestion des commandes
- name: Produits
  description: API pour la gestion des produits
- name: Clients
  description: API pour la gestion des clients
- name: Photos
  description: API pour la gestion des photos des produits
paths:
  /products:
    get:
      tags:
      - Produits
      summary: Récupération des produits
      description: "Retourne, de façon paginée, le catalogue des produits. Endpoint\
        \ public."
      operationId: listProducts
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseGetProductResponse"
        "400":
          description: |-
            Requête invalide

            - `INVALID_SORT_FIELD` : Champ de tri invalide (champs additionnels : reason)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    INVALID_SORT_FIELD: "#/components/schemas/Request_INVALID_SORT_FIELD"
                oneOf:
                - $ref: "#/components/schemas/Request_INVALID_SORT_FIELD"
        "500":
          description: |-
            Erreur interne du serveur

            - `INTERNAL_ERROR` : Erreur interne du serveur
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    INTERNAL_ERROR: "#/components/schemas/Server_INTERNAL_ERROR"
                oneOf:
                - $ref: "#/components/schemas/Server_INTERNAL_ERROR"
      security: []
    post:
      tags:
      - Produits
      summary: Création d'un produit
      description: Crée un nouveau produit de crochet adyl-creation.
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
        required: true
      responses:
        "201":
          description: Produit créé avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProductResponse"
        "400":
          description: |-
            Requête invalide

            - `INVALID_REQUEST_BODY` : Requête invalide (champs additionnels : errors)
            - `VALIDATION_FAILED` : Validation échouée (champs additionnels : errors)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    VALIDATION_FAILED: "#/components/schemas/Request_VALIDATION_FAILED"
                    INVALID_REQUEST_BODY: "#/components/schemas/Request_INVALID_REQUEST_BODY"
                oneOf:
                - $ref: "#/components/schemas/Request_VALIDATION_FAILED"
                - $ref: "#/components/schemas/Request_INVALID_REQUEST_BODY"
        "401":
          description: |-
            Authentification manquante ou invalide

            - `UNAUTHENTICATED` : Non authentifié
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    UNAUTHENTICATED: "#/components/schemas/Security_UNAUTHENTICATED"
                oneOf:
                - $ref: "#/components/schemas/Security_UNAUTHENTICATED"
        "403":
          description: |-
            Accès refusé

            - `FORBIDDEN` : Accès refusé
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    FORBIDDEN: "#/components/schemas/Security_FORBIDDEN"
                oneOf:
                - $ref: "#/components/schemas/Security_FORBIDDEN"
        "409":
          description: |-
            Conflit avec l'état actuel de la ressource

            - `PRODUCT_ALREADY_EXISTS` : Produit déjà existant (champs additionnels : name)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    PRODUCT_ALREADY_EXISTS: "#/components/schemas/CreateProduct_PRODUCT_ALREADY_EXISTS"
                oneOf:
                - $ref: "#/components/schemas/CreateProduct_PRODUCT_ALREADY_EXISTS"
        "500":
          description: |-
            Erreur interne du serveur

            - `INTERNAL_ERROR` : Erreur interne du serveur
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    INTERNAL_ERROR: "#/components/schemas/Server_INTERNAL_ERROR"
                oneOf:
                - $ref: "#/components/schemas/Server_INTERNAL_ERROR"
  /products/{id}/photos:
    post:
      tags:
      - Photos
      summary: Ajout de photos à un produit
      description: Ajoute une ou plusieurs photos à un produit de crochet adyl-creation
        existant.
      operationId: addProductPhotos
      parameters:
      - name: id
        in: path
        description: Identifiant du produit
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photos:
                  type: array
                  description: Photos à ajouter (au moins une)
                  items:
                    type: string
                    format: binary
              required:
              - photos
        required: true
      responses:
        "201":
          description: Photos ajoutées avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddProductPhotosResponse"
        "400":
          description: |-
            Requête invalide

            - `INVALID_MULTIPART_REQUEST` : Requête multipart invalide (champs additionnels : reason)
            - `INVALID_PARAMETER` : Paramètre invalide (champs additionnels : parameter, reason)
            - `VALIDATION_FAILED` : Validation échouée (champs additionnels : errors)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    INVALID_MULTIPART_REQUEST: "#/components/schemas/Request_INVALID_MULTIPART_REQUEST"
                    VALIDATION_FAILED: "#/components/schemas/Request_VALIDATION_FAILED"
                    INVALID_PARAMETER: "#/components/schemas/Request_INVALID_PARAMETER"
                oneOf:
                - $ref: "#/components/schemas/Request_INVALID_MULTIPART_REQUEST"
                - $ref: "#/components/schemas/Request_VALIDATION_FAILED"
                - $ref: "#/components/schemas/Request_INVALID_PARAMETER"
        "401":
          description: |-
            Authentification manquante ou invalide

            - `UNAUTHENTICATED` : Non authentifié
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    UNAUTHENTICATED: "#/components/schemas/Security_UNAUTHENTICATED"
                oneOf:
                - $ref: "#/components/schemas/Security_UNAUTHENTICATED"
        "403":
          description: |-
            Accès refusé

            - `FORBIDDEN` : Accès refusé
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    FORBIDDEN: "#/components/schemas/Security_FORBIDDEN"
                oneOf:
                - $ref: "#/components/schemas/Security_FORBIDDEN"
        "404":
          description: |-
            Ressource introuvable

            - `PRODUCT_NOT_FOUND` : Produit introuvable (champs additionnels : productId)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    PRODUCT_NOT_FOUND: "#/components/schemas/AddProductPhotos_PRODUCT_NOT_FOUND"
                oneOf:
                - $ref: "#/components/schemas/AddProductPhotos_PRODUCT_NOT_FOUND"
        "422":
          description: |-
            Règle métier non respectée

            - `PHOTO_EXTENSION_NOT_ALLOWED` : Extension incorrecte (champs additionnels : allowedExtensions, fileName)
            - `PHOTO_LIST_EMPTY` : Aucune image
            - `PHOTO_MAX_SIZE_EXCEEDED` : Image trop volumineuse (champs additionnels : fileName, maxSizeBytes, sizeBytes)
            - `PHOTO_SIZE_ZERO` : Image vide (champs additionnels : fileName)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    PHOTO_LIST_EMPTY: "#/components/schemas/AddProductPhotos_PHOTO_LIST_EMPTY"
                    PHOTO_SIZE_ZERO: "#/components/schemas/AddProductPhotos_PHOTO_SIZE_ZERO"
                    PHOTO_MAX_SIZE_EXCEEDED: "#/components/schemas/AddProductPhotos_PHOTO_MAX_SIZE_EXCEEDED"
                    PHOTO_EXTENSION_NOT_ALLOWED: "#/components/schemas/AddProductPhotos_PHOTO_EXTENSION_NOT_ALLOWED"
                oneOf:
                - $ref: "#/components/schemas/AddProductPhotos_PHOTO_LIST_EMPTY"
                - $ref: "#/components/schemas/AddProductPhotos_PHOTO_SIZE_ZERO"
                - $ref: "#/components/schemas/AddProductPhotos_PHOTO_MAX_SIZE_EXCEEDED"
                - $ref: "#/components/schemas/AddProductPhotos_PHOTO_EXTENSION_NOT_ALLOWED"
        "500":
          description: |-
            Erreur interne du serveur

            - `INTERNAL_ERROR` : Erreur interne du serveur
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    INTERNAL_ERROR: "#/components/schemas/Server_INTERNAL_ERROR"
                oneOf:
                - $ref: "#/components/schemas/Server_INTERNAL_ERROR"
  /orders:
    get:
      tags:
      - Commandes
      summary: Récupération des commandes
      description: "Retourne, de façon paginée, les demandes de commandes du client\
        \ authentifié."
      operationId: listOrders
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseGetOrderResponse"
        "400":
          description: |-
            Requête invalide

            - `INVALID_SORT_FIELD` : Champ de tri invalide (champs additionnels : reason)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    INVALID_SORT_FIELD: "#/components/schemas/Request_INVALID_SORT_FIELD"
                oneOf:
                - $ref: "#/components/schemas/Request_INVALID_SORT_FIELD"
        "401":
          description: |-
            Authentification manquante ou invalide

            - `UNAUTHENTICATED` : Non authentifié
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    UNAUTHENTICATED: "#/components/schemas/Security_UNAUTHENTICATED"
                oneOf:
                - $ref: "#/components/schemas/Security_UNAUTHENTICATED"
        "403":
          description: |-
            Accès refusé

            - `FORBIDDEN` : Accès refusé
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    FORBIDDEN: "#/components/schemas/Security_FORBIDDEN"
                oneOf:
                - $ref: "#/components/schemas/Security_FORBIDDEN"
        "500":
          description: |-
            Erreur interne du serveur

            - `INTERNAL_ERROR` : Erreur interne du serveur
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    INTERNAL_ERROR: "#/components/schemas/Server_INTERNAL_ERROR"
                oneOf:
                - $ref: "#/components/schemas/Server_INTERNAL_ERROR"
    post:
      tags:
      - Commandes
      summary: Création d'une demande de commande
      description: Envoie la demande de commande pour prise en compte et traitement.
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
        required: true
      responses:
        "201":
          description: Demande de commande enregistrée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: |-
            Requête invalide

            - `INVALID_REQUEST_BODY` : Requête invalide (champs additionnels : errors)
            - `VALIDATION_FAILED` : Validation échouée (champs additionnels : errors)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    VALIDATION_FAILED: "#/components/schemas/Request_VALIDATION_FAILED"
                    INVALID_REQUEST_BODY: "#/components/schemas/Request_INVALID_REQUEST_BODY"
                oneOf:
                - $ref: "#/components/schemas/Request_VALIDATION_FAILED"
                - $ref: "#/components/schemas/Request_INVALID_REQUEST_BODY"
        "401":
          description: |-
            Authentification manquante ou invalide

            - `UNAUTHENTICATED` : Non authentifié
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    UNAUTHENTICATED: "#/components/schemas/Security_UNAUTHENTICATED"
                oneOf:
                - $ref: "#/components/schemas/Security_UNAUTHENTICATED"
        "403":
          description: |-
            Accès refusé

            - `FORBIDDEN` : Accès refusé
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    FORBIDDEN: "#/components/schemas/Security_FORBIDDEN"
                oneOf:
                - $ref: "#/components/schemas/Security_FORBIDDEN"
        "409":
          description: |-
            Conflit avec l'état actuel de la ressource

            - `PRODUCT_NOT_AVAILABLE` : Produits indisponibles (champs additionnels : productIds)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    PRODUCT_NOT_AVAILABLE: "#/components/schemas/CreateOrder_PRODUCT_NOT_AVAILABLE"
                oneOf:
                - $ref: "#/components/schemas/CreateOrder_PRODUCT_NOT_AVAILABLE"
        "422":
          description: |-
            Règle métier non respectée

            - `PRODUCTS_NOT_FOUND` : Produits introuvables (champs additionnels : productIds)
            - `PRODUCT_COLOR_NOT_AVAILABLE` : Couleur demandée non disponible (champs additionnels : availableColors, productId, requestedColor)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    PRODUCTS_NOT_FOUND: "#/components/schemas/CreateOrder_PRODUCTS_NOT_FOUND"
                    PRODUCT_COLOR_NOT_AVAILABLE: "#/components/schemas/CreateOrder_PRODUCT_COLOR_NOT_AVAILABLE"
                oneOf:
                - $ref: "#/components/schemas/CreateOrder_PRODUCTS_NOT_FOUND"
                - $ref: "#/components/schemas/CreateOrder_PRODUCT_COLOR_NOT_AVAILABLE"
        "500":
          description: |-
            Erreur interne du serveur

            - `INTERNAL_ERROR` : Erreur interne du serveur
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    INTERNAL_ERROR: "#/components/schemas/Server_INTERNAL_ERROR"
                oneOf:
                - $ref: "#/components/schemas/Server_INTERNAL_ERROR"
  /orders/{id}/reject:
    post:
      tags:
      - Commandes
      summary: Rejeter une commande
      description: "Rejette une commande, avec un motif optionnel. Une commande dé\
        jà livrée ne peut plus être rejetée."
      operationId: rejectOrder
      parameters:
      - name: id
        in: path
        description: Identifiant de la commande à rejeter
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectOrderRequest"
        required: true
      responses:
        "200":
          description: Commande rejetée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderRejectedResponse"
        "400":
          description: |-
            Requête invalide

            - `INVALID_PARAMETER` : Paramètre invalide (champs additionnels : parameter, reason)
            - `INVALID_REQUEST_BODY` : Requête invalide (champs additionnels : errors)
            - `VALIDATION_FAILED` : Validation échouée (champs additionnels : errors)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    VALIDATION_FAILED: "#/components/schemas/Request_VALIDATION_FAILED"
                    INVALID_REQUEST_BODY: "#/components/schemas/Request_INVALID_REQUEST_BODY"
                    INVALID_PARAMETER: "#/components/schemas/Request_INVALID_PARAMETER"
                oneOf:
                - $ref: "#/components/schemas/Request_VALIDATION_FAILED"
                - $ref: "#/components/schemas/Request_INVALID_REQUEST_BODY"
                - $ref: "#/components/schemas/Request_INVALID_PARAMETER"
        "401":
          description: |-
            Authentification manquante ou invalide

            - `UNAUTHENTICATED` : Non authentifié
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    UNAUTHENTICATED: "#/components/schemas/Security_UNAUTHENTICATED"
                oneOf:
                - $ref: "#/components/schemas/Security_UNAUTHENTICATED"
        "403":
          description: |-
            Accès refusé

            - `FORBIDDEN` : Accès refusé
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    FORBIDDEN: "#/components/schemas/Security_FORBIDDEN"
                oneOf:
                - $ref: "#/components/schemas/Security_FORBIDDEN"
        "404":
          description: |-
            Ressource introuvable

            - `ORDER_NOT_FOUND` : Commande introuvable (champs additionnels : orderId)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    ORDER_NOT_FOUND: "#/components/schemas/RejectOrder_ORDER_NOT_FOUND"
                oneOf:
                - $ref: "#/components/schemas/RejectOrder_ORDER_NOT_FOUND"
        "409":
          description: |-
            Conflit avec l'état actuel de la ressource

            - `ORDER_ALREADY_DELIVERED` : Commande livrée
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    ORDER_ALREADY_DELIVERED: "#/components/schemas/RejectOrder_ORDER_ALREADY_DELIVERED"
                oneOf:
                - $ref: "#/components/schemas/RejectOrder_ORDER_ALREADY_DELIVERED"
        "500":
          description: |-
            Erreur interne du serveur

            - `INTERNAL_ERROR` : Erreur interne du serveur
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    INTERNAL_ERROR: "#/components/schemas/Server_INTERNAL_ERROR"
                oneOf:
                - $ref: "#/components/schemas/Server_INTERNAL_ERROR"
  /orders/{id}/deliver:
    post:
      tags:
      - Commandes
      summary: Livrer une commande
      description: "Marque une commande acceptée comme livrée, avec son mode de livraison."
      operationId: deliverOrder
      parameters:
      - name: id
        in: path
        description: Identifiant de la commande à livrer
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverOrderRequest"
        required: true
      responses:
        "200":
          description: Commande livrée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDeliveredResponse"
        "400":
          description: |-
            Requête invalide

            - `INVALID_PARAMETER` : Paramètre invalide (champs additionnels : parameter, reason)
            - `INVALID_REQUEST_BODY` : Requête invalide (champs additionnels : errors)
            - `VALIDATION_FAILED` : Validation échouée (champs additionnels : errors)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    VALIDATION_FAILED: "#/components/schemas/Request_VALIDATION_FAILED"
                    INVALID_REQUEST_BODY: "#/components/schemas/Request_INVALID_REQUEST_BODY"
                    INVALID_PARAMETER: "#/components/schemas/Request_INVALID_PARAMETER"
                oneOf:
                - $ref: "#/components/schemas/Request_VALIDATION_FAILED"
                - $ref: "#/components/schemas/Request_INVALID_REQUEST_BODY"
                - $ref: "#/components/schemas/Request_INVALID_PARAMETER"
        "401":
          description: |-
            Authentification manquante ou invalide

            - `UNAUTHENTICATED` : Non authentifié
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    UNAUTHENTICATED: "#/components/schemas/Security_UNAUTHENTICATED"
                oneOf:
                - $ref: "#/components/schemas/Security_UNAUTHENTICATED"
        "403":
          description: |-
            Accès refusé

            - `FORBIDDEN` : Accès refusé
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    FORBIDDEN: "#/components/schemas/Security_FORBIDDEN"
                oneOf:
                - $ref: "#/components/schemas/Security_FORBIDDEN"
        "404":
          description: |-
            Ressource introuvable

            - `ORDER_NOT_FOUND` : Commande introuvable (champs additionnels : orderId)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    ORDER_NOT_FOUND: "#/components/schemas/DeliverOrder_ORDER_NOT_FOUND"
                oneOf:
                - $ref: "#/components/schemas/DeliverOrder_ORDER_NOT_FOUND"
        "409":
          description: |-
            Conflit avec l'état actuel de la ressource

            - `ORDER_ALREADY_REJECTED` : Commande rejetée
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    ORDER_ALREADY_REJECTED: "#/components/schemas/DeliverOrder_ORDER_ALREADY_REJECTED"
                oneOf:
                - $ref: "#/components/schemas/DeliverOrder_ORDER_ALREADY_REJECTED"
        "422":
          description: |-
            Règle métier non respectée

            - `ORDER_STILL_PENDING` : Commande en attente
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    ORDER_STILL_PENDING: "#/components/schemas/DeliverOrder_ORDER_STILL_PENDING"
                oneOf:
                - $ref: "#/components/schemas/DeliverOrder_ORDER_STILL_PENDING"
        "500":
          description: |-
            Erreur interne du serveur

            - `INTERNAL_ERROR` : Erreur interne du serveur
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
                    INTERNAL_ERROR: "#/components/schemas/Server_INTERNAL_ERROR"
                oneOf:
                - $ref: "#/components/schemas/Server_INTERNAL_ERROR"
  /orders/{id}/accept:
    post:
      tags:
      - Commandes
      summary: Accepter une commande
      description: "Accepte une commande en attente et applique, le cas échéant, la\
        \ remise de première commande."
      operationId: acceptOrder
      parameters:
      - name: id
        in: path
        description: Identifiant de la commande à accepter
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Commande acceptée avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderAcceptedResponse"
        "400":
          description: |-
            Requête invalide

            - `INVALID_PARAMETER` : Paramètre invalide (champs additionnels : parameter, reason)
          content:
            application/problem+json:
              schema:
                discriminator:
                  propertyName: code
                  mapping:
