components:
  schemas:
    CreateProductRequest:
      type: object
      description: Création d'un produit
      properties:
        name:
          type: string
          description: Nom du produit (unique)
          example: Bonnet en laine
          minLength: 1
        productCategory:
          $ref: "#/components/schemas/ProductCategoryRequest"
          description: Catégorie du produit
        colors:
          type:
          - array
          - "null"
          description: Couleurs disponibles
          example:
          - rouge
          - bleu
          items:
            type: string
        price:
          type: number
          description: "Prix unitaire strictement positif, en euros"
          example: 24.9
      required:
      - name
      - price
      - productCategory
    ProductCategoryRequest:
      type: string
      description: "Catégorie de produit : ACCESSORIES (accessoires) ou CLOTHING (vê\
        tements)"
      enum:
      - ACCESSORIES
      - CLOTHING
    CreateProductResponse:
      type: object
      description: Produit créé
      properties:
        productId:
          type: string
          format: uuid
          description: Identifiant du produit créé
        name:
          type: string
          description: Nom du produit
          example: Bonnet en laine
        price:
          type: number
          description: "Prix unitaire, en euros"
          example: 24.9
      required:
      - name
      - price
      - productId
    AddProductPhotosResponse:
      type: object
      description: Photos d'un produit après ajout
      properties:
        productId:
          type: string
          format: uuid
          description: Identifiant du produit
        photos:
          type: array
          description: "Photos du produit, triées par position"
          items:
            $ref: "#/components/schemas/ProductPhotoResponse"
      required:
      - photos
      - productId
    ProductPhotoResponse:
      type: object
      description: Photo d'un produit
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de la photo
        url:
          type: string
          description: URL de téléchargement de la photo
        position:
          type: integer
          format: int32
          description: Position de la photo dans la galerie du produit
          minimum: 0
      required:
      - id
      - position
      - url
    CreateOrderRequest:
      type: object
      description: Demande de commande
      properties:
        customerAddress:
          type: string
          description: Adresse de livraison
          example: 12 rue des Lilas
          minLength: 1
        customerCity:
          type: string
          description: Ville de livraison
          example: Avignon
          minLength: 1
        customerMessage:
          type:
          - string
          - "null"
          description: Message libre du client pour la commande
          example: Merci de livrer le matin
        items:
          type: array
          description: Produits commandés (au moins un)
          items:
            $ref: "#/components/schemas/ItemOrderRequest"
          minItems: 1
      required:
      - customerAddress
      - customerCity
      - items
    ItemOrderRequest:
      type: object
      description: Ligne d'une demande de commande
      properties:
        productId:
          type: string
          format: uuid
          description: Identifiant du produit commandé
        quantity:
          type: integer
          format: int32
          description: Quantité commandée
          example: 2
          minimum: 1
        color:
          type:
          - string
          - "null"
          description: "Couleur choisie, parmi celles proposées par le produit"
          example: rouge
      required:
      - productId
      - quantity
    CreateOrderResponse:
      type: object
      description: Commande enregistrée
      properties:
        orderId:
          type: string
          format: uuid
          description: Identifiant de la commande créée
        total:
          type: number
          description: "Montant total de la commande, en euros"
          example: 42.5
      required:
      - orderId
      - total
    RejectOrderRequest:
      type: object
      description: Rejet d'une commande
      properties:
        reason:
          type:
          - string
          - "null"
          description: "Motif du rejet, facultatif"
          example: Produit épuisé
          maxLength: 500
          minLength: 0
    OrderRejectedResponse:
      type: object
      description: Commande rejetée
      properties:
        orderId:
          type: string
          format: uuid
          description: Identifiant de la commande
        reason:
          type:
          - string
          - "null"
          description: "Motif du rejet, s'il a été renseigné"
        total:
          type: number
          description: "Montant total de la commande rejetée, en euros"
          example: 42.5
        orderState:
          $ref: "#/components/schemas/OrderStateResponse"
          description: État de la commande (toujours REJECTED)
        rejectedAt:
          type: string
          format: date-time
          description: Horodatage du rejet
          example: 2026-09-15T07:00:00Z
      required:
      - orderId
      - orderState
      - rejectedAt
      - total
    OrderStateResponse:
      type: string
      description: "État d'une commande : PENDING (en attente), ACCEPTED, REJECTED\
        \ ou DELIVERED"
      enum:
      - PENDING
      - REJECTED
      - DELIVERED
      - ACCEPTED
    DeliverOrderRequest:
      type: object
      description: Livraison d'une commande
      properties:
        deliveryMethod:
          $ref: "#/components/schemas/DeliveryMethodRequest"
          description: Mode de livraison
        observation:
          type:
          - string
          - "null"
          description: Observation libre sur la livraison
          example: Remis au voisin
      required:
      - deliveryMethod
    DeliveryMethodRequest:
      type: string
      description: "Mode de livraison : PICKUP_POINT (point relais) ou HAND_DELIVERY\
        \ (remise en main propre)"
      enum:
      - PICKUP_POINT
      - HAND_DELIVERY
    DeliveryMethodResponse:
      type: string
      description: "Mode de livraison : PICKUP_POINT (point relais) ou HAND_DELIVERY\
        \ (remise en main propre)"
      enum:
      - PICKUP_POINT
      - HAND_DELIVERY
    OrderDeliveredResponse:
      type: object
