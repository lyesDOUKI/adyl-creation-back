spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          audiences:
            - ${KEYCLOAK_API_AUDIENCE}

server:
  port: ${SERVER_PORT:8084}

app:
  base-url: ${APP_BASE_URL:http://localhost:8084}
  photos:
    storage-path: ${APP_PHOTOS_STORAGE_PATH:/data/photos}

keycloak:
  authorization-url: ${KEYCLOAK_AUTHORIZATION_URL}
  token-url: ${KEYCLOAK_TOKEN_URL}